name: ci

on:
  push:
    branches:
      - 'main'

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: cloud
          endpoint: 'nooproject/noo-web-builder'
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          # Plain single-arch manifest, so Docker Hub doesn't show an
          # extra unknown/unknown attestation entry next to the tag.
          provenance: false
          tags: |
            ${{ vars.DOCKER_USER }}/noo-api:release
            ${{ vars.DOCKER_USER }}/noo-api:stable
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
